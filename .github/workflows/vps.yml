name: Remote OpenCode

on:
  workflow_dispatch:

jobs:
  remote-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git tmux jq

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: Set runner SSH password
        shell: bash
        run: |
          PASSWORD="$(openssl rand -base64 24)"
          echo "RUNNER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "runner:$PASSWORD" | sudo chpasswd

      - name: Start SSH access
        uses: valeriangalliat/action-sshd-cloudflared@v4

      - name: Print SSH connection command
        shell: bash
        run: |
          echo "======================================"
          echo " REMOTE OPENCODE RUNNER READY"
          echo "======================================"
          echo ""
          echo "Buka log Start SSH access dan cari URL:"
          echo "https://....trycloudflare.com"
          echo ""
          echo "Gunakan URL tersebut pada perintah:"
          echo "ssh -o ProxyCommand='cloudflared access tcp --hostname https://HOSTNAME.trycloudflare.com' runner@action-sshd-cloudflared"
          echo ""
          echo "Password runner tersimpan pada environment job."
          echo "Buka log Start SSH access untuk memeriksa apakah tunnel aktif."
          echo "======================================"

      - name: Keep runner alive
        run: |
          while true; do
            sleep 60
          done
